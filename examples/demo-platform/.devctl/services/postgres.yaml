description: PostgreSQL backing service (opt-in data profile)
ports:
  db: 18004
container:
  image: postgres:16
  runtime: docker
  ports:
    db: 5432
  env:
    POSTGRES_USER: devctl
    POSTGRES_PASSWORD: devctl-local
    POSTGRES_DB: invoices
  volumes:
    - demo-platform-postgres:/var/lib/postgresql/data
health:
  type: tcp
  address: 127.0.0.1:18004
startup:
  wait_for_healthy: true
  timeout_seconds: 45
restart:
  policy: on_failure
  max_retries: 2
  backoff_seconds: 2
