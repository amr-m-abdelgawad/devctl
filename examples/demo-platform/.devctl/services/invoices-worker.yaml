description: Invoices worker — polls the invoices API and finalizes jobs
command:
  - python3
  - main.py
working_dir: invoices-worker
dependencies:
  - invoices-api
ports:
  http: 18002
environment:
  API_URL: http://127.0.0.1:${services.invoices-api.ports.http}
  required:
    - API_URL
health:
  type: http
  url: http://127.0.0.1:18002/health
identity:
  type: user
extends: python-http
startup:
  wait_for_healthy: true
  timeout_seconds: 20
capabilities:
  - local_http
