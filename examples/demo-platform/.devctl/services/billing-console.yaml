description: Billing console — React admin UI for the invoices platform
command:
  - bun
  - run
  - dev
working_dir: billing-console
dependencies:
  - invoices-api
ports:
  http: 18003
environment:
  AUTH_URL: ${services.identity.url}
  API_URL: ${services.invoices-api.url}
  required:
    - AUTH_URL
    - API_URL
environments:
  local:
    AUTH_URL: ${services.identity.url}
    API_URL: ${services.invoices-api.url}
    MODE: local
  deployed:
    AUTH_URL: https://identity.dev.example.com
    API_URL: https://invoices.dev.example.com
    MODE: deployed
default_environment: local
health:
  type: http
  url: http://127.0.0.1:18003/
extends: react-vite
startup:
  wait_for_healthy: true
  timeout_seconds: 45
capabilities:
  - local_http
