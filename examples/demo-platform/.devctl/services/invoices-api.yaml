description: Invoices API — job queue for invoice generation, calls identity
command:
  - python3
  - main.py
working_dir: invoices-api
hooks:
  pre_start: [python3, -c, "print('preparing invoices API')"]
dependencies:
  - identity
ports:
  http: 18000
environment:
  AUTH_URL: http://127.0.0.1:${services.identity.ports.http}
  required:
    - AUTH_URL
  defaults:
    LOG_LEVEL: INFO
environments:
  local:
    AUTH_URL: http://127.0.0.1:${services.identity.ports.http}
    MODE: local
  deployed:
    AUTH_URL: https://identity.dev.example.com
    MODE: deployed
    defaults:
      LOG_LEVEL: WARN
default_environment: local
health:
  type: http
  url: http://127.0.0.1:18000/health
identity:
  type: user
extends: python-http
startup:
  wait_for_healthy: true
  timeout_seconds: 20
capabilities:
  - local_http
