name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Compile and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install
        working-directory: app
        # Host bun install skips other OS/CPU optional packages. OpenTUI
        # resolves @opentui/core-<platform> at compile time, so every target
        # native package must be on disk before bun build --compile.
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - name: Compile binaries
        working-directory: app
        env:
          DEVCTL_VERSION: ${{ github.ref_name }}
          OUTDIR: ../dist
        run: |
          set -euo pipefail
          export DEVCTL_VERSION="${DEVCTL_VERSION#v}"
          bash ../.github/scripts/compile-binaries.sh
      - name: End-to-end supervisor smoke test (compiled binary)
        run: bash .github/scripts/smoke-test-binary.sh dist/devctl-linux-x64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/devctl-darwin-arm64 \
            dist/devctl-darwin-x64 \
            dist/devctl-linux-x64 \
            dist/devctl-linux-arm64 \
            dist/devctl-windows-x64.exe
