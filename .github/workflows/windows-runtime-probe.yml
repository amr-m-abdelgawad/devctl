name: Windows runtime probe

# Temporary. Bun 1.4.2 crashed or hung in the Windows unit job about one run
# in ten (JSC's JIT and GC threads). This counts the same on Bun 1.4.4, with
# 1.4.2 as a control on the same day's runners, and runs the two tests
# skipped on Windows for that crash with the skip lifted. Decided before
# reading: the crash counts as gone on 1.4.4 only if its legs have none
# while the control has at least two. Remove this file, the
# DEVCTL_WIN_PROBE_UNSKIP guards and .github/scripts/repeat-tests.cjs before
# the pull request merges.
#
# Runs when a pull request is given the `win-probe` label.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.label.name == 'win-probe'
    name: ${{ matrix.leg }}, ${{ matrix.half }} of 2
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        leg: [Bun 1.4.4, Bun 1.4.2 control, Bun 1.4.4 skipped tests]
        half: [1, 2]
        include:
          - leg: Bun 1.4.4
            bun: 1.4.4
            args: ""
          - leg: Bun 1.4.2 control
            bun: 1.4.2
            args: ""
          - leg: Bun 1.4.4 skipped tests
            bun: 1.4.4
            args: "--env DEVCTL_WIN_PROBE_UNSKIP=1 --only src/adapters/daemon/resource-sampler.test.ts --only src/adapters/daemon/supervisor.integration.test.ts"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - working-directory: app
        run: bun install --frozen-lockfile
      # Fifteen runs, twice over. A run still going after six minutes is stopped and counted as hung.
      - name: Repeat the tests
        working-directory: app
        run: node ../.github/scripts/repeat-tests.cjs 15 6 ${{ matrix.args }}
